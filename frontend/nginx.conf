# Redirect plain HTTP to HTTPS (browser<->app must be encrypted per subject).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    # Modern TLS only (no SSLv3/TLS1.0/1.1). No HSTS: it would pin this
    # self-signed host in the browser long after the demo.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # Allow image uploads to pass through.
    client_max_body_size 12m;

    # Backend: every API route + served uploads live under /api.
    # No trailing slash on proxy_pass so the /api prefix is preserved
    # (the backend uses setGlobalPrefix('api')).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live-42 crawls (e.g. /api/suggest) can outlast nginx's 60s default.
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # index.html must NEVER be cached: a redeploy changes the hashed chunk names
    # it references, and a stale cached index.html points at chunks that no longer
    # exist → nginx falls back to index.html (HTML) for the missing .js → a dynamic
    # import() receives HTML → "error loading dynamically imported module".
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    # Hashed build assets are immutable → cache hard; a MISSING one returns a real
    # 404 (never fall back to index.html, which hands JS-imports HTML instead).
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: serve static build, fall back to index.html for client-side routes.
    location / {
        root  /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
